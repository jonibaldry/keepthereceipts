version: 2.1

parameters:
  dockerhub-namespace:
    type: string
    default: "jonibaldry"

jobs:
  build-and-push:
    parameters:
      image_name:
        type: string
      dockerfile:
        type: string
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Docker login
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build << parameters.image_name >>
          command: |
            docker build \
              -f << parameters.dockerfile >> \
              -t << pipeline.parameters.dockerhub-namespace >>/<< parameters.image_name >>:latest \
              -t << pipeline.parameters.dockerhub-namespace >>/<< parameters.image_name >>:${CIRCLE_SHA1:0:7} \
              .
      - run:
          name: Push << parameters.image_name >>
          command: |
            docker push << pipeline.parameters.dockerhub-namespace >>/<< parameters.image_name >>:latest
            docker push << pipeline.parameters.dockerhub-namespace >>/<< parameters.image_name >>:${CIRCLE_SHA1:0:7}

workflows:
  build-and-push-images:
    jobs:
      - build-and-push:
          name: build-ipfs-node
          image_name: keepthereceipts-ipfs-node
          dockerfile: Dockerfile.ipfs
          context: dockerhub
          filters:
            branches:
              only: main
      - build-and-push:
          name: build-snapshotter
          image_name: keepthereceipts-snapshotter
          dockerfile: Dockerfile.snapshotter
          context: dockerhub
          filters:
            branches:
              only: main
      - build-and-push:
          name: build-frontend
          image_name: keepthereceipts-frontend
          dockerfile: Dockerfile.frontend
          context: dockerhub
          filters:
            branches:
              only: main
